name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked toolchain
        run: python -m pip install uv==0.11.20
      - name: Sync locked environment
        run: uv sync --extra dev --frozen --python 3.12
      - name: Assert tag matches package version
        shell: bash
        run: |
          package_version="$(uv run --frozen python -c 'from vaultcanary import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - name: Run release-equivalent gate
        run: uv run --frozen python scripts/check.py
      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --title "VaultCanary $GITHUB_REF_NAME"
          --notes-file "release-notes/$GITHUB_REF_NAME.md"
