name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked toolchain
        run: python -m pip install uv==0.11.20
      - name: Sync locked environment
        run: uv sync --extra dev --frozen --python ${{ matrix.python }}
      - name: Run quality and acceptance gates
        run: uv run --frozen python scripts/check.py --skip-package

  release-gate:
    name: Release gate and clean-wheel acceptance
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked toolchain
        run: python -m pip install uv==0.11.20
      - name: Sync locked environment
        run: uv sync --extra dev --frozen --python 3.12
      - name: Run release-equivalent gate
        run: uv run --frozen python scripts/check.py
      - name: Upload verified release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaultcanary-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14
