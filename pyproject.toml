[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultcanary"
version = "0.1.0"
description = "Test password-manager migration fidelity with disposable synthetic canaries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KanadeK" }]
keywords = [
  "password-manager",
  "migration",
  "bitwarden",
  "1password",
  "privacy",
  "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KanadeK/vaultcanary"
Documentation = "https://github.com/KanadeK/vaultcanary#readme"
Issues = "https://github.com/KanadeK/vaultcanary/issues"
Changelog = "https://github.com/KanadeK/vaultcanary/blob/main/CHANGELOG.md"

[project.scripts]
vaultcanary = "vaultcanary.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "mypy>=1.18",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "setuptools>=77",
  "twine>=6.2",
  "wheel>=0.45",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider --cov=vaultcanary --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["vaultcanary"]

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
